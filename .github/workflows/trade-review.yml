name: Dynasty Trade Review

# Manual, on-demand only (no schedule). Trigger from the Actions tab, enter a
# league ID, and the PAR report is published as an HTML page on GitHub Pages
# (one stable URL per league, so you can pin it in that league's chat). The
# same report is also attached to the run's Job Summary and as a .txt artifact.
#
# The ~16 MB Sleeper player map is cached (actions/cache, keyed by date) so
# repeated runs across leagues don't re-fetch it.

on:
  workflow_dispatch:
    inputs:
      league_id:
        description: 'Current-season Sleeper league ID (history is walked backward from it)'
        required: true
        type: string
      season:
        description: 'Only review this season (e.g. 2025). Blank = all seasons.'
        required: false
        type: string
      top:
        description: 'Number of highlight trades to show'
        required: false
        default: '12'
        type: string
      unfloored:
        description: 'Literal WAR (below-replacement weeks penalize) instead of floored default'
        required: false
        default: false
        type: boolean
      raw_points:
        description: 'Legacy points-only report instead of PAR'
        required: false
        default: false
        type: boolean

# contents: write is needed to publish to the gh-pages branch.
permissions:
  contents: write

# Serialize publishes so concurrent league runs don't race on gh-pages.
concurrency:
  group: trade-review-pages
  cancel-in-progress: false

jobs:
  trade-review:
    runs-on: ubuntu-latest
    env:
      # File cache for the Sleeper player map; persisted across runs below.
      SLEEPER_PLAYERS_FILE: .sleeper-cache/players-nfl.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        # trade_review.py imports only `requests` (redis is optional and
        # unused in CI; the file cache below stands in for it). Pinned to match
        # requirements.txt.
        run: pip install "requests==2.34.2"

      - name: Date key for player-map cache
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Sleeper player map
        # The player map changes at most once a day, so key by UTC date: same
        # day => cache hit (no 16 MB fetch); new day => fresh fetch + re-cache.
        uses: actions/cache@v4
        with:
          path: .sleeper-cache
          key: sleeper-players-${{ steps.date.outputs.today }}

      - name: Run trade review (HTML)
        id: run
        # Inputs are passed via env (never interpolated into the shell) to
        # avoid script injection, and assembled into a quoted args array.
        env:
          LEAGUE_ID: ${{ inputs.league_id }}
          SEASON: ${{ inputs.season }}
          TOP: ${{ inputs.top }}
          UNFLOORED: ${{ inputs.unfloored }}
          RAW_POINTS: ${{ inputs.raw_points }}
        run: |
          set -uo pipefail
          args=(--league-id "$LEAGUE_ID" --top "$TOP")
          if [ -n "$SEASON" ]; then args+=(--season "$SEASON"); fi
          if [ "$UNFLOORED" = "true" ]; then args+=(--unfloored); fi
          if [ "$RAW_POINTS" = "true" ]; then args+=(--raw-points); fi

          # Plain text (for the summary + artifact) and HTML (for Pages).
          python trade_review.py "${args[@]}" | tee report.txt
          [ "${PIPESTATUS[0]}" -eq 0 ] || { echo "trade_review failed" >&2; exit 1; }

          mkdir -p public/leagues
          python trade_review.py "${args[@]}" --html > "public/leagues/${LEAGUE_ID}.html"

      - name: Publish to GitHub Pages (per-league, additive)
        # keep_files: true preserves other leagues' pages already on gh-pages.
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          commit_message: "pages: trade review for league ${{ inputs.league_id }}"

      - name: Link + report to job summary
        if: always()
        env:
          LEAGUE_ID: ${{ inputs.league_id }}
          SEASON: ${{ inputs.season }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repo_name="${REPO#*/}"
          url="https://${OWNER}.github.io/${repo_name}/leagues/${LEAGUE_ID}.html"
          # Surface the link three ways: step log, a run-level annotation, and
          # the Job Summary (the annotation shows at the very top of the run).
          echo "Trade review page: ${url}"
          echo "::notice title=Trade Review page::${url}"
          {
            echo "## Dynasty Trade Review"
            echo "League \`${LEAGUE_ID}\`${SEASON:+ · season ${SEASON}}"
            echo ""
            echo "**Shareable page:** ${url}"
            echo ""
            echo '```text'
            if [ -f report.txt ]; then cat report.txt; else echo "(no output — run failed)"; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-review-report
          path: |
            report.txt
            public/leagues/*.html
          if-no-files-found: warn
