name: League of Chaos weekly scoring

# Tue/Wed poller. Once the most-recently-completed NFL week is fully charted by
# FTN, it scores the week with chaos.py, opens a GitHub issue with the report
# (which emails repo watchers), and publishes an HTML page to GitHub Pages at
# /chaos/<season>/week-<week>.html. A per-week dedup guard makes later polls
# that same week a no-op; manual dispatch always re-runs (so you can re-publish
# with manual chaos awards via the `adjustments` input).

on:
  schedule:
    - cron: '0 13,16,19,22 * * 2,3'   # 8am, 11am, 2pm, 5pm CDT (Tue, Wed)
    - cron: '0 1,3 * * 3,4'           # 8pm & 10pm CDT (Tue, Wed) next-day UTC
  workflow_dispatch:
    inputs:
      season:
        description: 'Season override (blank = auto-detect)'
        required: false
      week:
        description: 'Week override (blank = auto-detect)'
        required: false
      adjustments:
        description: 'Manual chaos awards, one "Team:+points" per line (optional)'
        required: false
        type: string

permissions:
  contents: write   # publish to gh-pages
  issues: write

# Serialize so concurrent runs don't race on gh-pages or Sleeper.
concurrency:
  group: chaos-scoring
  cancel-in-progress: false

jobs:
  poll-and-score:
    runs-on: ubuntu-latest
    env:
      # File cache for the ~16 MB Sleeper player map; persisted across runs.
      SLEEPER_PLAYERS_FILE: .sleeper-cache/players-nfl.json
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: ./install.sh

      - name: Date key for player-map cache
        id: date
        run: echo "today=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache Sleeper player map
        uses: actions/cache@v4
        with:
          path: .sleeper-cache
          key: sleeper-players-${{ steps.date.outputs.today }}

      - name: Resolve target week
        id: target
        env:
          IN_SEASON: ${{ inputs.season }}
          IN_WEEK: ${{ inputs.week }}
        run: |
          # Manual override takes precedence; otherwise auto-detect the most
          # recently completed week via chaos.py --print-target.
          if [ -n "$IN_SEASON" ] && [ -n "$IN_WEEK" ]; then
            season="$IN_SEASON"; week="$IN_WEEK"
          else
            set +e
            out=$(.venv/bin/python chaos.py --print-target)
            code=$?
            set -e
            if [ $code -ne 0 ] || [ -z "$out" ]; then
              echo "No completed regular-season week yet; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            season=$(echo "$out" | awk '{print $1}')
            week=$(echo "$out" | awk '{print $2}')
          fi
          echo "season=$season" >> "$GITHUB_OUTPUT"
          echo "week=$week" >> "$GITHUB_OUTPUT"
          echo "title=Chaos: $season Week $week scores" >> "$GITHUB_OUTPUT"

      - name: Stop if week already scored (scheduled runs only)
        id: dedup
        if: steps.target.outputs.skip != 'true' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.target.outputs.title }}
        run: |
          # Search open AND closed issues so a scored week never re-notifies.
          # Manual dispatch skips this guard so you can re-publish on demand.
          existing=$(gh issue list --state all \
            --search "$TITLE in:title" --json number --jq 'length')
          if [ "$existing" != "0" ]; then
            echo "Week already scored (issue exists); stopping for the week."
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Score, open issue, and build HTML page
        id: score
        if: steps.target.outputs.skip != 'true' && steps.dedup.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SEASON: ${{ steps.target.outputs.season }}
          WEEK: ${{ steps.target.outputs.week }}
          TITLE: ${{ steps.target.outputs.title }}
          ADJUSTMENTS: ${{ inputs.adjustments }}
        run: |
          set -uo pipefail

          # Optional manual chaos awards (multiline input -> file, never
          # interpolated into the shell).
          adj_args=()
          if [ -n "${ADJUSTMENTS:-}" ]; then
            printf '%s\n' "$ADJUSTMENTS" > adjustments.txt
            adj_args=(--adjust-file adjustments.txt)
          fi

          # One run: text report to stdout (for the issue) + HTML page to a
          # file (for Pages). chaos.py exits non-zero if the week isn't fully
          # charted yet, in which case nothing is published.
          mkdir -p "public/chaos/$SEASON"
          set +e
          .venv/bin/python chaos.py \
            --season "$SEASON" --week "$WEEK" --flag-candidates \
            "${adj_args[@]}" \
            --html-out "public/chaos/$SEASON/week-$WEEK.html" | tee out.txt
          code=${PIPESTATUS[0]}
          set -e

          if [ "$code" -ne 0 ]; then
            echo "Week not fully charted yet (chaos.py exit $code); nothing published."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh issue create --title "$TITLE" --body-file out.txt \
            --assignee kellermartin13
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Publish HTML to GitHub Pages
        if: steps.score.outputs.published == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
          commit_message: "pages: chaos ${{ steps.target.outputs.season }} week ${{ steps.target.outputs.week }}"

      - name: Pages URL to summary
        if: steps.score.outputs.published == 'true'
        env:
          SEASON: ${{ steps.target.outputs.season }}
          WEEK: ${{ steps.target.outputs.week }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="${REPO#*/}"
          url="https://${OWNER}.github.io/${repo}/chaos/${SEASON}/week-${WEEK}.html"
          echo "Chaos page: ${url}"
          echo "::notice title=Chaos page::${url}"
          {
            echo "## Chaos — ${SEASON} Week ${WEEK}"
            echo ""
            echo "**Page:** ${url}"
          } >> "$GITHUB_STEP_SUMMARY"
